<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naihan Liu — Brand & Marketing</title>
<meta name="description" content="Naihan Liu — brand and marketing professional based in Paris. Consumer insight, packaging development and visual content.">
<link rel="canonical" href="https://naihan-liu.github.io/">
<meta property="og:title" content="Naihan Liu — Brand & Marketing">
<meta property="og:url" content="https://naihan-liu.github.io/">
<meta property="og:image" content="https://naihan-liu.github.io/img/portrait.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* ============ Design tokens ============ */
  :root{
    --paper:#e7eaee;
    --card:#d8dce1;
    --ink:#1d1f22;
    --ink-soft:rgba(29,31,34,.62);
    --hairline:rgba(29,31,34,.12);
    --accent:#2f5bff;
    --edge:max(calc((100vw - 1560px)/2), clamp(16px,2.5vw,64px));
    --gap:clamp(10px,1vw,14px);
    --ease:cubic-bezier(.23,1,.32,1);
    --font:"Futura","Jost","Avenir Next",system-ui,"PingFang SC","Noto Sans SC",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#121417; --card:#1d2024; --ink:#f2f4f7;
      --ink-soft:rgba(242,244,247,.66); --hairline:rgba(242,244,247,.14);
    }
  }
  :root[data-theme="dark"]{
    --paper:#121417; --card:#1d2024; --ink:#f2f4f7;
    --ink-soft:rgba(242,244,247,.66); --hairline:rgba(242,244,247,.14);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--font);font-weight:300;
       -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s,color .4s}
  a{color:inherit;text-decoration:none}
  img,video{display:block;max-width:100%}
  section{scroll-margin-top:70px}
  .skip{position:absolute;left:-999px}
  .skip:focus{left:16px;top:16px;z-index:99;background:var(--ink);color:var(--paper);padding:8px 12px}

  /* ============ Header ============ */
  header{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;justify-content:space-between;
         padding:22px var(--edge);background:linear-gradient(var(--paper) 40%, transparent)}
  header::before{content:"";position:absolute;inset:0;z-index:-1;backdrop-filter:blur(10px);
         -webkit-mask:linear-gradient(#000 50%,transparent);mask:linear-gradient(#000 50%,transparent)}
  .logo{font-size:15px;letter-spacing:.12em}
  nav{display:flex;align-items:center;gap:clamp(16px,3vw,48px)}
  .links{display:flex;gap:clamp(14px,1.8vw,26px);font-size:13px;letter-spacing:.12em}
  .links a{color:var(--ink-soft);transition:color .3s}
  .links a:hover,.links a.active{color:var(--ink);font-weight:400}
  .social{display:flex;gap:22px}
  .social a{color:var(--ink-soft);display:grid;place-items:center;transition:color .3s,transform .3s var(--ease)}
  .social a:hover{color:var(--ink);transform:translateY(-2px)}
  .social svg{width:14px;height:14px}
  .theme-btn{background:none;border:0;color:var(--ink-soft);cursor:pointer;display:grid;place-items:center}
  .theme-btn:hover{color:var(--ink)}
  .theme-btn svg{width:15px;height:15px}

  /* ============ Hero ============ */
  .hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
        padding:110px var(--edge) 90px;position:relative;text-align:center}
  .tagline{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:clamp(18px,3vw,36px);line-height:1.8}
  .stage{position:relative;width:100%;display:grid;place-items:center}
  .big-name{position:absolute;top:-.12em;left:50%;transform:translateX(-50%);
            font-size:clamp(56px,10vw,150px);font-weight:500;letter-spacing:.05em;white-space:nowrap;
            color:var(--accent);filter:blur(7px);opacity:.75;pointer-events:none;
            animation:breathe 7s ease-in-out infinite}
  @keyframes breathe{50%{filter:blur(11px);opacity:.55}}
  .carousel{position:relative;width:min(460px,72vw);aspect-ratio:1.18;margin-top:clamp(40px,6vw,70px)}
  .slide{position:absolute;inset:0;border-radius:6px;overflow:hidden;opacity:0;
         transform:translateY(14px) rotate(-1.5deg) scale(.97);
         transition:opacity .9s var(--ease),transform .9s var(--ease);
         box-shadow:0 30px 60px -20px rgba(20,30,60,.35),0 8px 18px -8px rgba(20,30,60,.25)}
  .slide.on{opacity:1;transform:none}
  .slide img{width:100%;height:100%;object-fit:cover}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;
         color:var(--ink);opacity:.7;padding:20px;transition:opacity .3s,transform .4s var(--ease)}
  .arrow:hover{opacity:1}
  .arrow svg{width:14px;height:42px}
  .prev{left:clamp(-140px,-14vw,-40px)} .prev:hover{transform:translate(-4px,-50%)}
  .next{right:clamp(-140px,-14vw,-40px)} .next:hover{transform:translate(4px,-50%)}
  .caption{margin-top:34px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);min-height:1em}
  .scroll-cue{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);color:var(--ink-soft);animation:cue 2.4s ease-in-out infinite}
  .scroll-cue svg{width:32px;height:14px}
  @keyframes cue{50%{transform:translate(-50%,6px)}}

  /* placeholder slides / cards (remove once real photos are added) */
  .ph{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(18px,3vw,36px);color:#fff;text-align:left}
  .ph b{font-weight:400;font-size:clamp(26px,3.4vw,52px);letter-spacing:.02em;line-height:1}
  .ph i{font-style:normal;font-size:12px;letter-spacing:.24em;text-transform:uppercase;opacity:.75;margin-bottom:10px}
  .ph .stat{position:absolute;top:clamp(18px,3vw,36px);right:clamp(18px,3vw,36px);text-align:right;font-size:12px;letter-spacing:.14em;opacity:.85}
  .ph .stat strong{display:block;font-weight:400;font-size:clamp(22px,2.6vw,38px);letter-spacing:.02em}
  .slide .ph{justify-content:center;align-items:center;text-align:center}
  .slide .ph b{font-size:clamp(34px,5vw,60px);letter-spacing:.12em;text-transform:uppercase;font-weight:300}

  /* ============ Sections ============ */
  .section{padding:40px var(--edge) 110px}
  .label{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:22px}

  /* Projects grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start}
  .col{display:flex;flex-direction:column;gap:var(--gap)}
  .card{position:relative;display:block;overflow:hidden;border-radius:3px;background:var(--card);cursor:pointer;
        border:0;font:inherit;text-align:left;width:100%;color:inherit;
        opacity:0;transform:translateY(40px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
  .card.in{opacity:1;transform:none}
  .card .media{width:100%;transition:transform 1.2s var(--ease)}
  .card .media img,.card .media video{width:100%;height:100%;object-fit:cover}
  .card:hover .media{transform:scale(1.03)}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.5));opacity:0;transition:opacity .5s}
  .card:hover::after,.card:focus-visible::after{opacity:1}
  .meta{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;justify-content:space-between;align-items:end;gap:12px;
        padding:16px 16px 14px;color:#fff;font-size:14px;letter-spacing:.04em;opacity:0;transform:translateY(8px);
        transition:opacity .5s var(--ease),transform .5s var(--ease)}
  .meta small{font-size:13px;opacity:.85}
  .card:hover .meta,.card:focus-visible .meta{opacity:1;transform:none}
  .card:hover .ph b,.card:hover .ph i{opacity:0}
  .ph b,.ph i{transition:opacity .4s}

  /* Experience list */
  .xp{border-top:1px solid var(--hairline)}
  .xp-row{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:24px;align-items:baseline;
          padding:22px 0;border-bottom:1px solid var(--hairline);transition:padding .5s var(--ease)}
  .xp-row:hover{padding-left:10px}
  .xp-date{font-size:13px;letter-spacing:.08em;color:var(--ink-soft)}
  .xp-co{font-size:clamp(20px,2vw,26px);font-weight:400;letter-spacing:.02em}
  .xp-role{display:block;font-size:15px;color:var(--ink-soft);margin-top:4px}
  .xp-loc{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}

  /* About */
  .about{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:clamp(24px,5vw,80px);align-items:start}
  .portrait{width:100%;max-width:380px;aspect-ratio:4/5;object-fit:cover;border-radius:4px;
            filter:grayscale(.15);box-shadow:0 30px 60px -24px rgba(20,30,60,.35)}
  .about h2{font-size:clamp(30px,3.6vw,48px);font-weight:400;letter-spacing:.02em;line-height:1.15;margin-bottom:24px}
  .about p{font-size:17px;line-height:1.75;color:var(--ink-soft);max-width:62ch}
  .about p+p{margin-top:1em}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px 40px;margin-top:40px;padding-top:32px;border-top:1px solid var(--hairline)}
  .facts h3{font-size:12px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px}
  .facts li{list-style:none;font-size:15px;line-height:1.7}
  .facts li span{color:var(--ink-soft)}

  /* Contact */
  .contact{text-align:center;padding:120px var(--edge) 140px}
  .avail{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft)}
  .avail::before{content:"";width:7px;height:7px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 0 rgba(47,191,113,.6);animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 9px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
  .contact h2{font-size:clamp(36px,6vw,84px);font-weight:300;letter-spacing:.03em;margin:22px 0 30px;line-height:1.05}
  .contact a.mail{font-size:clamp(16px,1.6vw,20px);letter-spacing:.08em;border-bottom:1px solid var(--hairline);padding-bottom:6px;transition:border-color .3s}
  .contact a.mail:hover{border-color:var(--ink)}

  footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:28px var(--edge) 40px;
         border-top:1px solid var(--hairline);font-size:12px;letter-spacing:.12em;color:var(--ink-soft)}
  footer .row{display:flex;gap:22px;flex-wrap:wrap}
  footer a:hover{color:var(--ink)}

  /* ============ Project modal ============ */
  .modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
         background:rgba(15,17,20,.4);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s}
  .modal.open{opacity:1;pointer-events:auto}
  .sheet{position:relative;background:var(--paper);color:var(--ink);width:min(820px,100%);max-height:88vh;overflow:auto;border-radius:6px;
         transform:translateY(24px);transition:transform .6s var(--ease);box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
  .modal.open .sheet{transform:none}
  .sheet .cover{aspect-ratio:2.2}
  .sheet .cover img,.sheet .cover video{width:100%;height:100%;object-fit:cover}
  .cover-cap{padding:12px clamp(22px,4vw,44px) 0;font-size:12px;letter-spacing:.14em;color:var(--ink-soft)}
  .sheet .body{padding:clamp(22px,4vw,44px)}
  .sheet .kicker{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft)}
  .sheet h3{font-size:clamp(26px,3vw,38px);font-weight:400;margin:10px 0 6px}
  .sheet .role{color:var(--ink-soft);font-size:15px}
  .stats{display:flex;flex-wrap:wrap;gap:16px 40px;margin:26px 0;padding:20px 0;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
  .stats div{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .stats strong{display:block;font-size:26px;font-weight:400;letter-spacing:.02em;color:var(--ink);text-transform:none;margin-bottom:2px}
  .sheet ul{padding-left:18px}
  .sheet li{font-size:16px;line-height:1.7;color:var(--ink-soft);margin-bottom:8px}
  .close{position:absolute;top:14px;right:14px;z-index:2;background:var(--paper);border:1px solid var(--hairline);
         color:var(--ink);border-radius:999px;font:inherit;font-size:12px;letter-spacing:.14em;padding:7px 14px;cursor:pointer}

  /* ============ Mobile ============ */
  .menu-btn{display:none;background:none;border:0;color:var(--ink);font:inherit;font-size:13px;letter-spacing:.12em;cursor:pointer}
  .drawer{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;justify-content:center;
          padding:0 32px;gap:22px;font-size:32px;letter-spacing:.06em;opacity:0;pointer-events:none;transition:opacity .4s}
  .drawer.open{opacity:1;pointer-events:auto}
  .drawer > button{position:absolute;top:22px;right:20px;background:none;border:0;color:var(--ink);font:inherit;font-size:13px;letter-spacing:.12em}
  @media (max-width:760px){
    .links,.social{display:none}
    .menu-btn{display:block}
    .grid{grid-template-columns:1fr}
    .about{grid-template-columns:1fr}
    .portrait{max-width:260px}
    .prev{left:-34px}.next{right:-34px}
    .meta{opacity:1;transform:none}
    .card::after{opacity:1}
    .card .ph b,.card .ph i{opacity:0}
    .xp-row{grid-template-columns:1fr;gap:6px}
    .xp-loc{order:-1}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
  /* ============ Language switch ============ */
  .lang{display:flex;gap:2px;font-size:12px;letter-spacing:.08em}
  .lang button{background:none;border:0;font:inherit;color:var(--ink-soft);cursor:pointer;padding:4px 6px;border-radius:999px;transition:color .3s,background .3s}
  .lang button:hover{color:var(--ink)}
  .lang button[aria-pressed="true"]{color:var(--ink);background:var(--hairline)}
  .drawer .lang{font-size:15px;margin-top:20px}
  :lang(zh) .about h2{letter-spacing:.04em;line-height:1.35}
  :lang(zh) .about p,:lang(zh) .sheet li{line-height:1.9}
  :lang(zh) .contact h2{letter-spacing:.08em;line-height:1.3}
  @media (max-width:760px){ header .lang{display:none} }
</style>
</head>

<a class="skip" href="#main" data-i18n="skip"></a>

<header>
  <a class="logo" href="#top"></a>
  <nav>
    <div class="links">
      <a href="#work" class="active" data-i18n="work"></a>
      <a href="#experience" data-i18n="experience"></a>

<main id="main">
  <section class="hero" id="top">
    <p class="tagline" id="tagline"></p>
    <div class="stage">
      <div class="big-name" id="bigName"></div>
      <div class="carousel" id="carousel">

  <section class="section" id="work">
    <p class="label" data-i18n="workLabel"></p>
    <div class="grid"><div class="col" id="colA"></div><div class="col" id="colB"></div></div>
  </section>

  <section class="section" id="experience">
    <p class="label" data-i18n="xpLabel"></p>
    <div class="xp" id="xp"></div>
  </section>

  <section class="section" id="about">
    <p class="label" data-i18n="aboutLabel"></p>
    <div class="about">
      <img class="portrait" id="portrait" alt="">
      <div>
        <h2 id="aboutTitle"></h2>
        <div id="aboutText"></div>
        <div class="facts" id="facts"></div>
      </div>
    </div>
  </section>

  <section class="contact" id="contact">
    <span class="avail" data-i18n="available"></span>
    <h2 data-i18n-html="contactTitle"></h2>
    <a class="mail" id="mailLink"></a>
  </section>
</main>

<footer>
  <span id="copy"></span>
  <div class="row" id="footSocial"></div>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet" id="sheet"></div>
</div>

const LANGS = [['en','EN','en'],['zh','中文','zh-CN'],['fr','FR','fr']];
const codes = LANGS.map(l => l[0]);
let lang = (() => {
  const q = new URLSearchParams(location.search).get('lang'); if (codes.includes(q)) return q;
  try { const s = localStorage.getItem('lang'); if (codes.includes(s)) return s; } catch(e){}
  const n = (navigator.language || 'en').slice(0,2).toLowerCase();
  return codes.includes(n) ? n : 'en';
})();
const t = v => (v && typeof v === 'object' && !Array.isArray(v)) ? (v[lang] ?? v.en) : v;

// ---------- carousel ----------
const car = $('carousel');
let cur = 0, timer;
function renderCarousel(){
  car.querySelectorAll('.slide').forEach(s => s.remove());
  SITE.hero.forEach((h,i) => {
    const d = document.createElement('div');
    d.className = 'slide' + (i===cur ? ' on' : '');
    d.innerHTML = h.image ? `<img src="${h.image}" alt="${t(h.caption)}">` : `<div class="ph" style="background:${grad(h.color)}"><b>${t(h.caption)}</b></div>`;
    car.insertBefore(d, $('prev'));
  });
  $('caption').textContent = t(SITE.hero[cur].caption);
}
function go(n){
  const slides = car.querySelectorAll('.slide');
  slides[cur].classList.remove('on');
  cur = (n + slides.length) % slides.length;
  slides[cur].classList.add('on');
  $('caption').textContent = t(SITE.hero[cur].caption);
  clearInterval(timer); timer = setInterval(() => go(cur+1), 6000);
}
$('prev').onclick = () => go(cur-1);
$('next').onclick = () => go(cur+1);

// ---------- work cards ----------
const mediaHTML = (p, withText=true) => p.video ? `<video src="${p.video}" autoplay muted loop playsinline></video>`
  : p.image ? `<img src="${p.image}" alt="${t(p.title)}" loading="lazy">`
  : withText ? `<div class="ph" style="background:${grad(p.color)}"><div class="stat"><strong>${t(p.stat[0])}</strong>${t(p.stat[1])}</div><i>${p.year} · ${company(p)}</i><b>${t(p.title)}</b></div>`
  : `<div style="height:100%;background:${grad(p.color)}"></div>`;
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
}), {threshold:.12});
let firstRender = true;
function renderCards(){
  const cols = [$('colA'), $('colB')], h = [0,0];
  cols.forEach(c => c.innerHTML = '');
  SITE.projects.forEach((p,idx) => {
    const a = document.createElement('button');
    a.className = 'card' + (firstRender ? '' : ' in'); a.type = 'button';
    a.innerHTML = `<div class="media" style="aspect-ratio:${p.ratio||1.6}">${mediaHTML(p)}</div>
      <div class="meta"><span>${t(p.title)}</span><small>${p.year} · ${t(p.tag)}</small></div>`;
    a.onclick = () => openProject(idx);
    const k = h[0] <= h[1] ? 0 : 1;
    cols[k].appendChild(a); h[k] += 1/(p.ratio||1.6);
    if (firstRender){ a.style.transitionDelay = (k*90)+'ms'; io.observe(a); }
  });
}

// ---------- project modal ----------
let lastFocus;
function openProject(i){
  const p = SITE.projects[i]; lastFocus = document.activeElement;
  $('sheet').innerHTML = `<button class="close" id="mClose">${t(SITE.ui.close)} ✕</button>
    <div class="cover" style="aspect-ratio:${p.image||p.video ? (p.ratio||1.6) : 2.2}">${mediaHTML(p, false)}</div>
    ${p.caption ? `<p class="cover-cap">${t(p.caption)}</p>` : ''}
    <div class="body">
      <p class="kicker">${p.year} · ${t(p.tag)}</p>
      <h3 id="mTitle">${t(p.title)}</h3>
      <p class="role">${role(p)} — ${company(p)} · ${t(p.place)}</p>
      <div class="stats">${p.stats.map(s=>`<div><strong>${t(s[0])}</strong>${t(s[1])}</div>`).join('')}</div>
      <ul>${p.points.map(x=>`<li>${t(x)}</li>`).join('')}</ul>
    </div>`;
  $('modal').classList.add('open'); document.body.style.overflow='hidden';
  $('mClose').onclick = closeProject; $('mClose').focus();
}
function closeProject(){
  if (!$('modal').classList.contains('open')) return;
  $('modal').classList.remove('open'); document.body.style.overflow=''; lastFocus && lastFocus.focus();
}
$('modal').onclick = e => { if (e.target.id === 'modal') closeProject(); };
addEventListener('keydown', e => {
  if (e.key === 'Escape') closeProject();
  if (!$('modal').classList.contains('open') && e.target === document.body){ if (e.key==='ArrowLeft') go(cur-1); if (e.key==='ArrowRight') go(cur+1); }
});

// ---------- render everything for the current language ----------
function render(){
  const U = SITE.ui;
  document.documentElement.lang = LANGS.find(l => l[0]===lang)[2];
  document.title = t(U.title);
  document.querySelector('meta[name="description"]').content = t(U.description);
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(U[el.dataset.i18n]));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(U[el.dataset.i18nHtml]));
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('tagline').textContent = t(U.tagline);
  $('portrait').alt = t(U.portraitAlt);
  $('aboutTitle').textContent = t(SITE.about.title);
  $('aboutText').innerHTML = SITE.about.paragraphs.map(p => `<p>${t(p)}</p>`).join('');
  $('facts').innerHTML = SITE.facts.map(f => `<div><h3>${t(f.title)}</h3><ul>${f.items.map(i=>`<li>${t(i)}</li>`).join('')}</ul></div>`).join('');
  $('xp').innerHTML = SITE.experience.map(x => `<div class="xp-row"><span class="xp-date">${t(x.date)}</span>
    <div><span class="xp-co">${t(x.company)}</span><span class="xp-role">${t(x.role)}</span></div><span class="xp-loc">${t(x.loc)}</span></div>`).join('');
  renderCarousel();
  renderCards();
  firstRender = false;
}
function setLang(c){
  if (c === lang) return;
  lang = c;
  try { localStorage.setItem('lang', c); } catch(e){}
  const u = new URL(location.href); u.searchParams.set('lang', c);
  try { history.replaceState(null, '', u); } catch(e){}
  closeProject();
  render();
}
render();
go(0);

// ---------- active nav link ----------
const navLinks = document.querySelectorAll('.links a');
const so = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#'+e.target.id));
}), {rootMargin:'-45% 0px -50% 0px'});
['work','experience','about','contact'].forEach(id => so.observe($(id)));

// ---------- theme toggle ----------
$('themeBtn').onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', r.dataset.theme); } catch(e){}
};
try { const th = localStorage.getItem('theme'); if (th) document.documentElement.dataset.theme = th; } catch(e){}

// ---------- mobile menu ----------
$('menuBtn').onclick = () => $('drawer').classList.add('open');
$('closeBtn').onclick = () => $('drawer').classList.remove('open');
$('drawer').querySelectorAll('a').forEach(a => a.onclick = () => $('drawer').classList.remove('open'));
</script>
</body>
